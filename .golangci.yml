version: "2"

run:
  # Lint the db-tagged tests too (make test-db runs them).
  build-tags:
    - db

linters:
  default: none
  enable:
    # Design doc item 5.
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - depguard
    # TASKS.md T4 (strictness), T5 (test rules), T7 (decay sensors).
    - exhaustive
    - wrapcheck
    - nilerr
    - nolintlint
    - thelper
    - tparallel
    - unused
    - dupl
  settings:
    exhaustive:
      # A switch on a tagged union lists every case; a default does not count as covering them.
      default-signifies-exhaustive: false
    wrapcheck:
      # problem.Field builds the problem the HTTP layer answers; wrapping it would hide its type.
      ignore-package-globs:
        - github.com/jnaranj09/open-customer/internal/platform/problem
    nolintlint:
      require-explanation: true
      require-specific: true
    dupl:
      # AST tokens: a pasted 20-line function trips it at 80, not at 90 (measured at T7).
      threshold: 80
    depguard:
      # Only the coarse module rules (design doc "Code layout and module rules"); the per-module
      # allow-list is a review check.
      rules:
        domain-never-imports-httpapi:
          files:
            - "**/internal/**"
            - "!**/internal/httpapi/**"
          deny:
            - pkg: github.com/jnaranj09/open-customer/internal/httpapi
              desc: domain modules never import httpapi or its generated code
        auth-imports-no-domain-module:
          files:
            - "**/internal/auth/**"
          deny:
            - pkg: github.com/jnaranj09/open-customer/internal/settings
              desc: auth gets the settings creator as a function from cmd
            - pkg: github.com/jnaranj09/open-customer/internal/attributes
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/clients
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/services
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/appointments
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/media
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/templates
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/reminders
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/push
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/scheduler
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/exporter
              desc: auth imports no domain module
            - pkg: github.com/jnaranj09/open-customer/internal/status
              desc: auth imports no domain module
        reminders-only-from-orchestrators:
          files:
            - "$all"
            - "!**/internal/reminders/**"
            - "!**/internal/httpapi/**"
            - "!**/internal/scheduler/**"
            - "!**/cmd/open-customer/**"
          deny:
            - pkg: github.com/jnaranj09/open-customer/internal/reminders
              desc: only httpapi, scheduler and cmd import reminders
  exclusions:
    presets:
      - std-error-handling
    rules:
      # db.DBTX is the name the design doc fixes for the interface modules take (item 25).
      - path: internal/db/db\.go
        linters:
          - revive
        text: type name will be used as db\.DBTX
      # The design doc (items 40 and 44) names these types SettingsInput and SettingsPatch.
      - path: internal/settings/settings\.go
        linters:
          - revive
        text: type name will be used as settings\.Settings(Input|Patch)
      # The design doc (item 52) and the task brief name this type MediaInput.
      - path: internal/media/media\.go
        linters:
          - revive
        text: type name will be used as media\.MediaInput
      # G101 reads any string constant whose name says "Password" as a credential. messages.go holds
      # only the Spanish field messages the API returns (design doc item 24, OP14).
      - path: internal/platform/problem/messages\.go
        linters:
          - gosec
        text: "G101:"
      # G124 wants Secure to be a constant true. The session cookie's Secure is false only for a
      # plain-http localhost PUBLIC_URL (development and e2e), where WebKit drops a Secure cookie
      # (design doc "Session and request rules" and item 5).
      - path: internal/auth/sessions\.go
        linters:
          - gosec
        text: "G124:"
      # Tests may repeat setup; duplication is measured on shipped code (TASKS.md T7).
      - path: _test\.go
        linters:
          - dupl
          - wrapcheck

formatters:
  enable:
    - gofmt
