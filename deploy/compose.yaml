# The production stack (design doc "Deployment", item 81). Values come from .env next to this file
# (copy .env.example; the variables are in the design doc's "Configuration (`.env`)" table). No
# service publishes a port: cloudflared reaches app:8080 on the Compose network. Start it with
# `docker compose up -d`; upgrades, restores and manual backups go through scripts/.
name: open-customer

services:
  db:
    # The pin is PG_IMAGE in the Makefile; make check-pins fails if this copy differs.
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-open_customer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:-open_customer}
    volumes:
      # From PG 18 the data lives under /var/lib/postgresql/18/docker; a volume at the old
      # /var/lib/postgresql/data path would not hold it.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: on a first start the image's init server answers on the socket only.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/jnaranj09/open-customer:${APP_VERSION:?APP_VERSION is required in .env}
    # The image's own command is `serve`; it runs as the non-root user 65532.
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-open_customer}
      DB_NAME: ${DB_NAME:-open_customer}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT is required in .env}
      # Optional: empty means the app's own default (internal/platform/config), so the defaults
      # have one owner.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MEDIA_DIR: ${MEDIA_DIR:-}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
      ALLOW_MIGRATE_WITHOUT_BACKUP: ${ALLOW_MIGRATE_WITHOUT_BACKUP:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    volumes:
      - media:/data/media
      - backup-status:/backup-status:ro
    healthcheck:
      # Exec form: distroless has no shell.
      test: ["CMD", "/usr/local/bin/open-customer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    # Bumped by Dependabot (the docker-compose entry for /deploy).
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required in .env}
    depends_on:
      app:
        condition: service_healthy

  backup:
    # The postgres base image declares VOLUME /var/lib/postgresql, so this service also gets an
    # empty anonymous volume there; it holds nothing (accepted).
    image: ghcr.io/jnaranj09/open-customer-backup:${APP_VERSION:?APP_VERSION is required in .env}
    restart: unless-stopped
    # The postgres base image sets SIGINT; backup.sh traps TERM and INT.
    stop_signal: SIGTERM
    environment: &backup-env
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD is required in .env}
      # Every snapshot is tagged app=<APP_VERSION>.
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required in .env}
      PGHOST: ${DB_HOST:-db}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-open_customer}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      PGDATABASE: ${DB_NAME:-open_customer}
    volumes:
      - media:/media:ro
      - backup-status:/backup-status
      # BACKUP_TARGET is any host folder (a USB or second disk is optional). backup.sh writes
      # there only while the marker file .open-customer-backup-target exists in it. rslave: a disk
      # mounted or unmounted there after the container started is seen inside it.
      - type: bind
        source: ${BACKUP_TARGET:?BACKUP_TARGET is required in .env}
        target: /target
        bind:
          propagation: rslave
    depends_on:
      db:
        condition: service_healthy

  # Only scripts/restore.sh runs it (`docker compose --profile restore run --rm restore ...`);
  # `docker compose up` never starts it, so it has no restart policy.
  restore:
    image: ghcr.io/jnaranj09/open-customer-backup:${APP_VERSION:?APP_VERSION is required in .env}
    profiles: ["restore"]
    stop_signal: SIGTERM
    environment: *backup-env
    volumes:
      - media:/media
      # Read-write: the restore takes the backup lock and unpacks into /backup-status/work.
      - backup-status:/backup-status
      # Read-only: snapshot-info and restore run restic with --no-lock.
      - type: bind
        source: ${BACKUP_TARGET:?BACKUP_TARGET is required in .env}
        target: /target
        read_only: true
        bind:
          propagation: rslave
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  backup-status:
