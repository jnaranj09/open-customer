# oapi-codegen config (design doc item 16). No strict-server: handlers get (w, r, params), so
# headers, multipart and streaming need no workaround.
package: gen
output: internal/httpapi/gen/api.gen.go
generate:
  std-http-server: true
  models: true
  embedded-spec: true
output-options:
  nullable-type: true
compatibility:
  # The wrapper of every operation with a security requirement puts gen.SessionCookieScopes on
  # the request context; httpapi's step 7 (design doc item 34) reads it to tell secured routes
  # from the `security: []` ones. oapi-codegen marks this flag deprecated (it cannot express OR or
  # AND of schemes); the spec has one scheme, so it is exact here.
  enable-auth-scopes-on-context: true
