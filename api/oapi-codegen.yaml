# oapi-codegen config (design doc item 16). No strict-server: handlers get (w, r, params), so
# headers, multipart and streaming need no workaround.
package: gen
output: internal/httpapi/gen/api.gen.go
generate:
  std-http-server: true
  models: true
  embedded-spec: true
compatibility:
  # Enum constants carry their type name, so a later schema (Appointment) cannot clash with a bare one.
  always-prefix-enum-values: true
output-options:
  nullable-type: true
