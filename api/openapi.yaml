openapi: 3.0.3
info:
  title: open-customer API
  version: 1.0.0
  description: >-
    The contract for the open-customer API. It holds only the endpoints of the current build
    phase (design doc item 15). Each operation lists the problem statuses its own handler can
    answer, plus a `default` Problem response for the ones the middleware can answer on any
    route: 403 forbidden-origin (every method but GET and HEAD), 403 must-change-password (any
    route not marked x-oc-allowed-while-must-change-password, public ones included, when the
    cookie is a must-change session) and 500 internal.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run setup is still open
      description: >-
        Has no authentication on purpose: the setup wizard calls it before any user or session
        exists, to decide whether to show the wizard.
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"
  /setup/options:
    get:
      operationId: getSetupOptions
      summary: The choices the setup wizard offers
      description: >-
        No session: the setup wizard needs it before any user exists. It lists the supported
        country codes.
      security: []
      responses:
        "200":
          description: Setup choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOptions"
        default:
          $ref: "#/components/responses/Problem"
  /setup:
    post:
      operationId: completeSetup
      summary: Finish first-run setup
      description: >-
        No session: it creates the owner user and her first session. The setup token from the
        setup link is what authorizes it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: The owner user; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: >-
        No session: it is how a session is made. It is rate limited per client IP and per
        username.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: The signed-in user; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out of this session
      description: >-
        Deletes the current session and expires the cookie. Allowed while must_change_password is
        set, so she can always sign out.
      x-oc-allowed-while-must-change-password: true
      responses:
        "204":
          description: Signed out; the cookie is expired.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ExpiredSessionCookie"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: >-
        Keeps this session and closes every other one, and clears must_change_password (allowed
        while it is set: this is how it is cleared). A wrong current_password is 422 validation on
        that field, not 401, and counts toward the same per-username delay as a failed login.
      x-oc-allowed-while-must-change-password: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password is changed.
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: >-
        Allowed while must_change_password is set, so the app can tell that it must ask for a new
        password.
      x-oc-allowed-while-must-change-password: true
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings:
    patch:
      operationId: updateSettings
      summary: Change the business settings
      description: >-
        Changes only the fields sent. currency, country_code and locale are fixed at setup, so
        sending one is an unknown field and a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /settings/icon:
    post:
      operationId: uploadIcon
      summary: Replace the app icon
      description: >-
        Both parts are PNG files of at most 1 MB each, and the request is at most 3 MB. A part
        that is not a PNG of exactly its size (512 or 180 px square), or a body that is not
        multipart/form-data, is 415. A missing, repeated or unknown part is 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IconUpload"
      responses:
        "204":
          description: The icons are stored; /icons/512.png and /apple-touch-icon.png serve them.
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attributes:
    post:
      operationId: createAttribute
      summary: Add an attribute
      description: >-
        The key is made from the label and never changes. The attribute goes last in its scope.
        An unknown scope or type is 422 on that field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeInput"
      responses:
        "201":
          description: The new attribute, with no options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attributes/{id}:
    patch:
      operationId: updateAttribute
      summary: Change an attribute
      description: >-
        Changes only the fields sent. The key, scope and type cannot change, so sending one is an
        unknown field and a 422. archived true archives the attribute and false restores it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributePatch"
      responses:
        "200":
          description: The attribute after the change, with its options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attributes/{id}/options:
    post:
      operationId: createOption
      summary: Add an option to a select attribute
      description: >-
        Only select and multiselect attributes take options. The option goes last among its siblings.
        A parent_id must be an active option of the same attribute.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionInput"
      responses:
        "201":
          description: The new option.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Option"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attributes/{id}/options/{optionId}:
    patch:
      operationId: updateOption
      summary: Change an option
      description: >-
        Changes only the fields sent. The parent cannot change, so sending parent_id is an unknown
        field and a 422.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: optionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionPatch"
      responses:
        "200":
          description: The option after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Option"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /services:
    post:
      operationId: createService
      summary: Add a service
      description: >-
        The service goes last. duration_min is 1 to 1440, price_cents is 0 or more (left out or null
        means no price) and color is #rrggbb (stored in lowercase).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: The new service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /services/{id}:
    patch:
      operationId: updateService
      summary: Change a service
      description: >-
        Changes only the fields sent. Only price_cents and description may be null, which clears
        the price or the description. archived true archives the service and false restores it.
        Past appointments keep the values they copied. include_overdue is read only with archived,
        as on updateTemplate, for the specific come_back rules whose service or return service this
        is.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePatch"
      responses:
        "200":
          description: The service after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /clients:
    get:
      operationId: listClients
      summary: List the clients
      description: >-
        The active clients ordered by name, or the archived ones with archived=true. Unpaged.
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createClient
      summary: Add a client
      description: >-
        name is 1 to 120 characters and notes up to 2000. phone is read with the business country as
        the default region, and an empty phone means no phone. When another active client has the
        same phone the answer is 409 duplicate-phone with those clients, unless
        allow_duplicate_phone is true. attrs holds client-scope attribute values by key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: The new client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /clients/{id}:
    get:
      operationId: getClient
      summary: Get one client
      description: An archived client is returned too.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateClient
      summary: Change a client
      description: >-
        Changes only the fields sent. phone and notes may be null, which clears them; an empty phone
        string also means no phone. attrs merges by key and null removes a key. archived true
        archives the client and false restores it. The duplicate-phone check (409) runs when the
        phone changes and when an archived client is restored, unless allow_duplicate_phone is
        true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientPatch"
      responses:
        "200":
          description: The client after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /clients/{id}/appointments:
    get:
      operationId: listClientAppointments
      summary: List one client's appointments
      description: >-
        Every status, newest first, unpaged. An archived client still lists; an unknown client is
        404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The appointments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /appointments:
    get:
      operationId: listAppointments
      summary: List the appointments of a range of days
      description: >-
        Every status, ordered by starts_at. from and to are local days in the business time zone,
        both inclusive. to must not be before from and at most 31 days after it; otherwise the
        answer is 422 on to.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The appointments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentList"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAppointment
      summary: Book an appointment
      description: >-
        The appointment starts as scheduled. ends_at defaults to starts_at plus the durations of the
        services; at least one service or an explicit ends_at is required. An unknown or archived
        client or service is 422. When it overlaps a scheduled or confirmed appointment the answer
        is 409 overlap with those appointments, unless allow_overlap is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: The new appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /appointments/{id}:
    get:
      operationId: getAppointment
      summary: Get one appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAppointment
      summary: Change an appointment
      description: >-
        Changes only the fields sent. notes and paid_cents may be null, which clears them. attrs
        merges by key and null removes a key. service_ids replaces the whole list: a service already
        on the appointment keeps its saved line and price; only added services are copied at
        today's price. The overlap check (409 overlap) runs when the times of a scheduled or
        confirmed appointment change, unless allow_overlap is true. client_id and status cannot be
        changed here.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentPatch"
      responses:
        "200":
          description: The appointment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /appointments/{id}/status:
    post:
      operationId: setAppointmentStatus
      summary: Change the status of an appointment
      description: >-
        An allowed change gives 200; any other is 409 invalid-transition. A change to scheduled
        ("Reactivar") runs the overlap check (409 overlap) unless allow_overlap is true.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentStatusChange"
      responses:
        "200":
          description: The appointment after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /clients/{id}/media:
    get:
      operationId: listClientMedia
      summary: List one client's photos
      description: >-
        The active photos, newest first, unpaged. Archived photos are left out. An archived client
        still lists; an unknown client is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /templates:
    post:
      operationId: createTemplate
      summary: Add a message template
      description: >-
        The name is 1 to 80 characters. The body is stored exactly as sent and is 1 to 2000
        characters. A body with a malformed or unknown variable is 422 on body, one error per
        problem: syntax errors first, then unknown variables, each in body order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: The new template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /templates/preview:
    post:
      operationId: previewTemplate
      summary: Render a template body for a client or the sample
      description: >-
        Renders the body on the server. Without client_id it uses the built-in sample client and
        appointment. With client_id it uses that client (archived ones too) and her latest
        appointment that is not cancelled or no-show, or the sample appointment when she has none;
        an unknown client is 422 on client_id. The render never fails: a malformed "{{" shows as
        text and an unknown variable shows its fallback, or nothing. unknown_vars lists each
        unknown variable once as "namespace.key", in body order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePreviewInput"
      responses:
        "200":
          description: The rendered text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatePreview"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /templates/{id}:
    patch:
      operationId: updateTemplate
      summary: Change a message template
      description: >-
        Changes only the fields sent; none may be null. A body that is sent goes through the same
        check as on create. archived true archives the template and false restores it.
        include_overdue is read only with archived: on archive, as on a reminder rule archive, for
        each specific come_back rule the archive stops; on restore, as on a reminder rule restore,
        for each one the restore lets send again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePatch"
      responses:
        "200":
          description: The template after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /reminder-rules:
    post:
      operationId: createReminderRule
      summary: Add a reminder rule
      description: >-
        A before_appointment rule takes an offset_days of 0 to 365 and no service. A come_back rule
        takes an offset_days of 1 to 365 and either a service_id with an optional return_service_id
        (the service to book again; the rule's own service when left out), or no service_id: a
        general rule for every service, which takes no return_service_id. The template and the
        services must exist and be active. include_overdue true counts items already past their
        moment; false or left out counts only items from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: The new rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /reminder-rules/{id}:
    patch:
      operationId: updateReminderRule
      summary: Change a reminder rule
      description: >-
        Changes only the fields sent. Only return_service_id may be null (the rule's own service
        again); a general rule takes none. A rule never changes kind or service. include_overdue is
        read only when the change can make new items appear, and when archiving a specific
        come_back rule that could send: true lets the general rule bring that rule's late visits,
        false or left out starts it from now (handover_from).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePatch"
      responses:
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /reminders/due:
    get:
      operationId: listDueReminders
      summary: List the reminders to send today
      description: >-
        The items due today or earlier, computed on read from one snapshot, ordered by due date, then
        client name. Items already sent or skipped are not listed.
      responses:
        "200":
          description: The due items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /reminders/log:
    post:
      operationId: recordReminder
      summary: Record that a due item was sent or skipped
      description: >-
        Stores what the owner did with a due item. When the same item (rule, appointment and
        anchor) is already logged, nothing is written and the stored row comes back with 200. An
        unknown rule or appointment, an anchor that does not fit the rule's kind, an action other
        than sent or skipped, or phone digits that are not 1 to 15 digits, is 422 on that field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntry"
      responses:
        "201":
          description: The new log row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogItem"
        "200":
          description: The row was already logged; the stored row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogItem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listReminderLog
      summary: List the reminder log of one client or one day
      description: >-
        Exactly one of client_id or date is required; none or both is 422 on client_id. date is a
        local day in the business time zone and filters on acted_at. Newest acted_at first. An
        unknown client_id is 404.
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The log rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /push/key:
    get:
      operationId: getPushKey
      summary: The VAPID public key
      description: >-
        No session on purpose: the key is public, and the service worker may ask for it before the
        owner has signed in.
      security: []
      responses:
        "200":
          description: The VAPID public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushKey"
        default:
          $ref: "#/components/responses/Problem"
  /push/subscriptions:
    post:
      operationId: subscribePush
      summary: Store this device's push subscription
      description: >-
        The browser's PushSubscription JSON, stored for the signed-in user. A known endpoint keeps
        its row and ID and takes the new keys (200); a new one is 201. An endpoint that is not an
        https URL, or keys that are not base64url of the right length, are 422 on that field.
        expirationTime is accepted and ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: The new subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionId"
        "200":
          description: The endpoint was already stored; its keys are updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionId"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /export:
    get:
      operationId: exportData
      summary: Download every record as a ZIP
      description: >-
        A ZIP of clientas.csv, citas.csv, servicios.csv and datos.json, read in one snapshot and
        streamed. The file name is open-customer-YYYY-MM-DD.zip, the business-local date. An error
        before the first byte is a normal problem response; after it the connection is closed, so the
        download fails instead of ending as a ZIP that looks complete.
      responses:
        "200":
          description: The ZIP.
          headers:
            Content-Disposition:
              description: attachment; filename="open-customer-YYYY-MM-DD.zip".
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /status:
    get:
      operationId: getStatus
      summary: The status screen data
      description: >-
        Version, migration version, the timer's heartbeat age, the backup line, free space on the
        media volume and the push line. heartbeat_age_s is null until the timer has ticked once;
        media_free_bytes is null when the volume cannot be read. A missing or unreadable backup status
        file gives all backup times null and backup.red true. The push line is red with no
        subscription, or when the last daily push reached nobody.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /bootstrap:
    get:
      operationId: getBootstrap
      summary: Everything the app caches, from one snapshot
      description: >-
        Settings, attributes, services, templates and rules (these four include archived rows), the
        active clients, the appointments of every status that start on the local days from to to,
        both inclusive, the due list and the template variables. All of it is read in one
        transaction. to must not be before from and at most 200 days after it; otherwise the answer
        is 422 on to.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /client-errors:
    post:
      operationId: logClientError
      summary: Log an error from the app
      description: >-
        The PWA reports an error it caught. The server logs it at warn with code=client_error.
        message (1 to 2000 characters), app_version (1 to 64) and route (1 to 200) outside their limits
        are 422 on that field; a stack over 8000 characters is cut. Each session has a token bucket: a
        burst of 10, then one more every 6 seconds; past it, 429 with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorInput"
      responses:
        "204":
          description: Logged.
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /media:
    post:
      operationId: uploadMedia
      summary: Upload a photo
      description: >-
        Both parts are JPEG files: full of at most 10 MB and thumb of at most 1 MB, and the request
        is at most 12 MB. client_id and appointment_id are optional but at least one is needed; with
        appointment_id the photo belongs to that appointment's client, and a different client_id is
        422. A part that is not a JPEG, or a body that is not multipart/form-data, is 415. A part or
        request over its limit is 413. A missing, repeated or unknown part, or an owner that is
        missing, unknown, archived or mismatched, is 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MediaUpload"
      responses:
        "201":
          description: The stored photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /media/{id}:
    get:
      operationId: getMedia
      summary: Get the full image of a photo
      description: An archived photo is served too. The image never changes, so it is cached for a year.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The JPEG.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMedia
      summary: Archive or restore a photo
      description: archived true hides the photo from the client's list and false restores it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaPatch"
      responses:
        "200":
          description: The photo after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /media/{id}/thumb:
    get:
      operationId: getMediaThumb
      summary: Get the thumbnail of a photo
      description: An archived photo is served too. The image never changes, so it is cached for a year.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The JPEG thumbnail.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  headers:
    SessionCookie:
      description: >-
        The oc_session cookie: HttpOnly, SameSite=Lax, Path=/, 90 days, and Secure unless
        PUBLIC_URL is plain http.
      schema:
        type: string
    ExpiredSessionCookie:
      description: The oc_session cookie with an empty value and Max-Age=0, which deletes it.
      schema:
        type: string
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oc_session
  schemas:
    Settings:
      type: object
      required: [name, timezone, locale, currency, country_code, accent_color, push_hour, has_custom_icon]
      properties:
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
        currency:
          type: string
        country_code:
          type: string
        accent_color:
          type: string
        push_hour:
          type: integer
        has_custom_icon:
          type: boolean
    SettingsPatch:
      type: object
      description: Every field is optional; a field left out is not changed.
      properties:
        name:
          type: string
        timezone:
          type: string
        accent_color:
          type: string
        push_hour:
          type: integer
    IconUpload:
      type: object
      required: [icon512, icon180]
      properties:
        icon512:
          type: string
          format: binary
          description: The 512 by 512 px PNG.
        icon180:
          type: string
          format: binary
          description: The 180 by 180 px PNG (apple-touch-icon).
    AttributeScope:
      type: string
      enum: [client, appointment]
    AttributeType:
      type: string
      enum: [text, number, date, select, multiselect]
    Option:
      type: object
      required: [id, attribute_id, parent_id, label, position, archived]
      properties:
        id:
          type: string
          format: uuid
        attribute_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The option this one sits under; null for a top-level option.
        label:
          type: string
        position:
          type: integer
        archived:
          type: boolean
    Attribute:
      type: object
      required: [id, key, label, scope, type, required, position, archived, options]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        label:
          type: string
        scope:
          $ref: "#/components/schemas/AttributeScope"
        type:
          $ref: "#/components/schemas/AttributeType"
        required:
          type: boolean
        position:
          type: integer
        archived:
          type: boolean
        options:
          type: array
          description: Every option, archived ones included; empty for a type without options.
          items:
            $ref: "#/components/schemas/Option"
    AttributeInput:
      type: object
      required: [label, scope, type]
      properties:
        label:
          type: string
        scope:
          $ref: "#/components/schemas/AttributeScope"
        type:
          $ref: "#/components/schemas/AttributeType"
        required:
          type: boolean
          default: false
    AttributePatch:
      type: object
      description: Every field is optional and none may be null; a field left out is not changed.
      properties:
        label:
          type: string
        required:
          type: boolean
        position:
          type: integer
        archived:
          type: boolean
    OptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
        parent_id:
          type: string
          format: uuid
    OptionPatch:
      type: object
      description: Every field is optional and none may be null; a field left out is not changed.
      properties:
        label:
          type: string
        position:
          type: integer
        archived:
          type: boolean
    Me:
      type: object
      required: [id, username, must_change_password]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        must_change_password:
          type: boolean
    SetupOptions:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          description: ISO 3166-1 alpha-2 codes, sorted.
          items:
            type: string
    SetupSettings:
      type: object
      description: The Settings fields without has_custom_icon. A missing push_hour means 8.
      required: [name, timezone, locale, currency, country_code, accent_color]
      properties:
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
        currency:
          type: string
        country_code:
          type: string
        accent_color:
          type: string
        push_hour:
          type: integer
    SetupInput:
      type: object
      required: [token, username, password, settings]
      properties:
        token:
          type: string
        username:
          type: string
        password:
          type: string
        settings:
          $ref: "#/components/schemas/SetupSettings"
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean
        accent_color:
          type: string
          description: >-
            The business color, once setup is done (absent before). Public like the manifest's
            theme_color: the login screen uses it on a device with no cached settings.
    Service:
      type: object
      required: [id, name, description, duration_min, price_cents, color, position, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
          description: >-
            One line added to quotes after the service name; null when the service has none.
        duration_min:
          type: integer
        price_cents:
          type: integer
          format: int64
          nullable: true
          description: The price in cents; null when the service has no price.
        color:
          type: string
        position:
          type: integer
        archived:
          type: boolean
    ServiceInput:
      type: object
      required: [name, duration_min, color]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: One line, up to 200 characters; blank or null means none.
        duration_min:
          type: integer
        price_cents:
          type: integer
          format: int64
          nullable: true
        color:
          type: string
    ServicePatch:
      type: object
      description: >-
        Every field is optional; a field left out is not changed. Only price_cents and description
        may be null.
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          description: One line, up to 200 characters; blank or null clears it.
        duration_min:
          type: integer
        price_cents:
          type: integer
          format: int64
          nullable: true
        color:
          type: string
        position:
          type: integer
        archived:
          type: boolean
        include_overdue:
          type: boolean
          description: Read only with archived; see updateService.
    Template:
      type: object
      required: [id, name, body, archived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        body:
          type: string
        archived:
          type: boolean
    TemplateInput:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
        body:
          type: string
    TemplatePreviewInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
        client_id:
          type: string
          format: uuid
    TemplatePreview:
      type: object
      required: [text, unknown_vars]
      properties:
        text:
          type: string
        unknown_vars:
          type: array
          items:
            type: string
    TemplatePatch:
      type: object
      description: Every field is optional; a field left out is not changed. None may be null.
      properties:
        name:
          type: string
        body:
          type: string
        archived:
          type: boolean
        include_overdue:
          type: boolean
          description: Read only with archived; see updateTemplate.
    RuleKind:
      type: string
      enum: [before_appointment, come_back]
    Rule:
      type: object
      required: [id, kind, service_id, return_service_id, offset_days, template_id, applies_from, archived, handover_from]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/RuleKind"
        service_id:
          type: string
          format: uuid
          nullable: true
        return_service_id:
          type: string
          format: uuid
          nullable: true
        offset_days:
          type: integer
        template_id:
          type: string
          format: uuid
        applies_from:
          type: string
          format: date-time
          nullable: true
          description: Items before this moment are not counted; null means overdue items are included.
        archived:
          type: boolean
        handover_from:
          type: string
          format: date-time
          nullable: true
          description: >-
            Only on a specific come_back rule that stopped sending: the general rule brings its
            visits due from this moment on; null means from the start (or not answered).
    RuleInput:
      type: object
      required: [kind, offset_days, template_id]
      properties:
        kind:
          $ref: "#/components/schemas/RuleKind"
        service_id:
          type: string
          format: uuid
          nullable: true
        return_service_id:
          type: string
          format: uuid
          nullable: true
        offset_days:
          type: integer
        template_id:
          type: string
          format: uuid
        include_overdue:
          type: boolean
    RulePatch:
      type: object
      description: >-
        Every field is optional; a field left out is not changed. Only return_service_id may be null.
      properties:
        offset_days:
          type: integer
        template_id:
          type: string
          format: uuid
        return_service_id:
          type: string
          format: uuid
          nullable: true
        archived:
          type: boolean
        include_overdue:
          type: boolean
    DueItemMode:
      type: string
      enum: [message, booking_prompt]
    BookingPrompt:
      type: object
      description: The future booking a come-back item asks to extend with the return service.
      required: [appointment_id, starts_at, services, return_service_id, return_service_name]
      properties:
        appointment_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        services:
          type: array
          items:
            type: string
        return_service_id:
          type: string
          format: uuid
        return_service_name:
          type: string
    DueItem:
      type: object
      required: [id, rule_id, appointment_id, anchor_at, kind, client_id, client_name, due_date, late, text, phone_digits, wa_link, mode, prompt, source_starts_at, source_services, general, offset_days, shown_until, message_number, next_due_date]
      properties:
        id:
          type: string
        rule_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        anchor_at:
          type: string
          format: date-time
          nullable: true
          description: The appointment start for a before_appointment item; null for come_back.
        kind:
          $ref: "#/components/schemas/RuleKind"
        client_id:
          type: string
          format: uuid
        client_name:
          type: string
        due_date:
          type: string
          format: date
        late:
          type: boolean
        text:
          type: string
        phone_digits:
          type: string
          nullable: true
        wa_link:
          type: string
          nullable: true
          description: Null when the client has no phone.
        mode:
          $ref: "#/components/schemas/DueItemMode"
        prompt:
          allOf:
            - $ref: "#/components/schemas/BookingPrompt"
          nullable: true
          description: Set only when mode is booking_prompt.
        source_starts_at:
          type: string
          format: date-time
          description: The start of the appointment the item comes from.
        source_services:
          type: array
          items:
            type: string
          description: That appointment's service names, in line order.
        general:
          type: boolean
          description: True for a general rule's item (a come_back rule for every service).
        offset_days:
          type: integer
          description: The rule's days.
        shown_until:
          type: string
          format: date
          description: >-
            The last day the item is listed: come_back, the due day + 60 (a general item also ends
            the day before next_due_date); before_appointment, the appointment's day.
        message_number:
          type: integer
          description: >-
            For come_back, the come_back messages sent for the same appointment + 1 (skipped ones do
            not count); 1 for before_appointment.
        next_due_date:
          type: string
          format: date
          nullable: true
          description: General items only, the due day of the next general rule for the same visit.
    DueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DueItem"
    LogAction:
      type: string
      enum: [sent, skipped]
    LogEntry:
      type: object
      required: [rule_id, appointment_id, action, acted_at]
      properties:
        rule_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        anchor_at:
          type: string
          format: date-time
          nullable: true
          description: The appointment start for a before_appointment rule; null or left out for come_back.
        action:
          $ref: "#/components/schemas/LogAction"
        body:
          type: string
          nullable: true
        phone_digits:
          type: string
          nullable: true
        acted_at:
          type: string
          format: date-time
    TemplateVar:
      type: object
      required: [ns, key, label]
      properties:
        ns:
          type: string
        key:
          type: string
        label:
          type: string
    Bootstrap:
      type: object
      required: [server_time, settings, attributes, services, templates, rules, clients, appointments, due, template_vars, backup_red]
      properties:
        server_time:
          type: string
          format: date-time
        settings:
          $ref: "#/components/schemas/Settings"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/Attribute"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        templates:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        due:
          type: array
          items:
            $ref: "#/components/schemas/DueItem"
        template_vars:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVar"
        backup_red:
          type: boolean
    Status:
      type: object
      required: [version, migration_version, heartbeat_age_s, backup, media_free_bytes, push]
      properties:
        version:
          type: string
        migration_version:
          type: integer
          format: int64
        heartbeat_age_s:
          type: integer
          format: int64
          nullable: true
          description: Whole seconds since the timer's last heartbeat; null before its first tick.
        backup:
          $ref: "#/components/schemas/BackupStatus"
        media_free_bytes:
          type: integer
          format: int64
          nullable: true
          description: Bytes available to the app on the media volume; null when it cannot be read.
        push:
          $ref: "#/components/schemas/PushStatus"
    BackupStatus:
      type: object
      required: [checked_at, last_dump_at, last_copy_at, last_error, red]
      properties:
        checked_at:
          type: string
          format: date-time
          nullable: true
        last_dump_at:
          type: string
          format: date-time
          nullable: true
        last_copy_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        red:
          type: boolean
    PushStatus:
      type: object
      required: [subscriptions, last_push, red]
      properties:
        subscriptions:
          type: integer
        last_push:
          type: object
          nullable: true
          required: [date, attempted, delivered]
          properties:
            date:
              type: string
              format: date
            attempted:
              type: integer
            delivered:
              type: integer
        red:
          type: boolean
    ClientErrorInput:
      type: object
      required: [message, app_version, route]
      properties:
        message:
          type: string
        stack:
          type: string
        app_version:
          type: string
        route:
          type: string
    PushKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The VAPID public key, base64url without padding.
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
        expirationTime:
          type: number
          nullable: true
          description: Sent by every browser; accepted and ignored.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    PushSubscriptionId:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    LogItem:
      allOf:
        - $ref: "#/components/schemas/LogEntry"
        - type: object
          required: [id, kind, client_id, client_name]
          properties:
            id:
              type: string
              format: uuid
            kind:
              $ref: "#/components/schemas/RuleKind"
            client_id:
              type: string
              format: uuid
            client_name:
              type: string
    LogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogItem"
    Client:
      type: object
      required: [id, name, phone_e164, phone_digits, notes, attrs, archived, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone_e164:
          type: string
          nullable: true
          description: The phone in E.164 form, for example +34612345678; null when there is none.
        phone_digits:
          type: string
          nullable: true
          description: The same digits without the +; null when there is no phone.
        notes:
          type: string
          nullable: true
        attrs:
          type: object
          additionalProperties: true
          # No x-go-type-import: oapi-codegen already imports encoding/json for the embedded spec,
          # and a second import line makes the generated file not compile.
          x-go-type: json.RawMessage
          description: The client-scope attribute values by attribute key.
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        notes:
          type: string
        attrs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        allow_duplicate_phone:
          type: boolean
    ClientPatch:
      type: object
      description: >-
        Every field is optional; a field left out is not changed. Only phone and notes may be null.
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        attrs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        archived:
          type: boolean
        allow_duplicate_phone:
          type: boolean
    ClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
    AppointmentStatus:
      type: string
      enum: [scheduled, confirmed, cancelled, no_show]
    AppointmentService:
      type: object
      required: [service_id, name, price_cents, duration_min]
      properties:
        service_id:
          type: string
          format: uuid
        name:
          type: string
        price_cents:
          type: integer
          format: int64
          nullable: true
          description: The price copied when the line was saved; null when the service had none.
        duration_min:
          type: integer
    Appointment:
      type: object
      required: [id, client_id, client_name, starts_at, ends_at, status, done, total_cents, paid_cents, attrs, notes, services, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        client_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        done:
          type: boolean
          description: Computed on read, never stored. A scheduled or confirmed appointment that has ended.
        total_cents:
          type: integer
          format: int64
        paid_cents:
          type: integer
          format: int64
          nullable: true
        attrs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: The appointment-scope attribute values by attribute key.
        notes:
          type: string
          nullable: true
        services:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentService"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppointmentInput:
      type: object
      required: [client_id, starts_at]
      properties:
        client_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        attrs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        notes:
          type: string
        allow_overlap:
          type: boolean
    AppointmentPatch:
      type: object
      description: >-
        Every field is optional; a field left out is not changed. Only notes and paid_cents may be
        null.
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        service_ids:
          type: array
          items:
            type: string
            format: uuid
        attrs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        notes:
          type: string
          nullable: true
        paid_cents:
          type: integer
          format: int64
          nullable: true
        allow_overlap:
          type: boolean
    AppointmentStatusChange:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        allow_overlap:
          type: boolean
    AppointmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
    Media:
      type: object
      required: [id, client_id, appointment_id, width, height, bytes, created_at, archived]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
          nullable: true
        width:
          type: integer
          description: The width of the full image in pixels.
        height:
          type: integer
          description: The height of the full image in pixels.
        bytes:
          type: integer
          description: The size of the full image.
        created_at:
          type: string
          format: date-time
        archived:
          type: boolean
    MediaUpload:
      type: object
      required: [full, thumb]
      properties:
        full:
          type: string
          format: binary
          description: The full JPEG, at most 10 MB.
        thumb:
          type: string
          format: binary
          description: The thumbnail JPEG, at most 1 MB.
        client_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
    MediaPatch:
      type: object
      properties:
        archived:
          type: boolean
    MediaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
    Problem:
      type: object
      description: An RFC 9457 problem, sent as application/problem+json.
      required: [type, title, status]
      properties:
        type:
          type: string
          enum:
            - urn:open-customer:problem:validation
            - urn:open-customer:problem:not-found
            - urn:open-customer:problem:unauthorized
            - urn:open-customer:problem:invalid-credentials
            - urn:open-customer:problem:must-change-password
            - urn:open-customer:problem:forbidden-origin
            - urn:open-customer:problem:setup-closed
            - urn:open-customer:problem:setup-token-invalid
            - urn:open-customer:problem:overlap
            - urn:open-customer:problem:duplicate-phone
            - urn:open-customer:problem:invalid-transition
            - urn:open-customer:problem:payload-too-large
            - urn:open-customer:problem:unsupported-media-type
            - urn:open-customer:problem:rate-limited
            - urn:open-customer:problem:internal
        title:
          type: string
        status:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        retry_after_s:
          type: integer
        clients:
          type: array
          description: The other active clients with the phone, on a duplicate-phone 409.
          items:
            $ref: "#/components/schemas/Client"
        appointments:
          type: array
          description: The scheduled or confirmed appointments in the way, on an overlap 409.
          items:
            $ref: "#/components/schemas/Appointment"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
