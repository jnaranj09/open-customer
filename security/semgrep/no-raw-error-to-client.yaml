rules:
  - id: no-raw-error-to-client
    languages: [go]
    severity: ERROR
    message: >-
      A response must not carry an error's text (SQL, file paths, a driver message). Write a problem
      with a stable code from the problem package (.claude/rules/api.md, "Errors are codes, not
      messages"; threat T23).
    metadata:
      threat: T23
    paths:
      exclude:
        # Generated by oapi-codegen; its default parameter-error handler is replaced at run time
        # (TestErrorHandlerFuncWritesValidation) and the file is never hand-edited.
        - /internal/httpapi/gen/
    # Semgrep cannot type `err` when it comes from another package's call, so an error is found by
    # its Error() method (any variable name), or, as a bare value, by a name that is `err` or ends in
    # Err or Error. $W (a response writer) is only checked where the sink is not http.Error or a
    # problem/writeJSON call: the names the handlers use for it.
    pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: 'http.Error(..., <... $E.Error() ...>, ...)'
                  - pattern: 'problem.Field($N, <... $E.Error() ...>)'
                  - pattern: 'problem.FieldError{..., Message: <... $E.Error() ...>, ...}'
                  - pattern: 'writeJSON($W, $S, <... $E.Error() ...>)'
                  - pattern: 'json.NewEncoder($W).Encode(<... $E.Error() ...>)'
                  - pattern: '$W.Write(<... $E.Error() ...>)'
                  - pattern: 'fmt.Fprint($W, ..., <... $E.Error() ...>, ...)'
                  - pattern: 'fmt.Fprintf($W, ..., <... $E.Error() ...>, ...)'
                  - pattern: 'fmt.Fprintln($W, ..., <... $E.Error() ...>, ...)'
          - patterns:
              - pattern-either:
                  - pattern: 'http.Error(..., <... $E ...>, ...)'
                  - pattern: 'problem.Field($N, <... $E ...>)'
                  - pattern: 'problem.FieldError{..., Message: <... $E ...>, ...}'
                  - pattern: 'writeJSON($W, $S, <... $E ...>)'
                  - pattern: 'json.NewEncoder($W).Encode(<... $E ...>)'
                  - pattern: '$W.Write(<... $E ...>)'
                  - pattern: 'fmt.Fprint($W, ..., <... $E ...>, ...)'
                  - pattern: 'fmt.Fprintf($W, ..., <... $E ...>, ...)'
                  - pattern: 'fmt.Fprintln($W, ..., <... $E ...>, ...)'
              - metavariable-regex:
                  metavariable: $E
                  regex: ^(err|[a-z][A-Za-z]*Err|[a-z][A-Za-z]*Error)$
