rules:
  - id: no-raw-error-to-client
    languages: [go]
    severity: ERROR
    message: >-
      A response must not carry an error's text (SQL, file paths, a driver message). Write a problem
      with a stable code from the problem package (.claude/rules/api.md, "Errors are codes, not
      messages"; threat T23).
    metadata:
      threat: T23
    paths:
      exclude:
        # Generated by oapi-codegen; its default parameter-error handler is replaced at run time
        # (TestErrorHandlerFuncWritesValidation) and the file is never hand-edited.
        - /internal/httpapi/gen/
    # Semgrep cannot type `err` when it comes from another package's call, so the error is found by
    # its Error() method or by a name that ends in err or Error.
    patterns:
      - metavariable-regex:
          metavariable: $E
          regex: ^(err|[a-z][A-Za-z]*Err|[a-z][A-Za-z]*Error)$
      - pattern-either:
          - pattern: http.Error(..., <... $E.Error() ...>, ...)
          - pattern: http.Error(..., <... $E ...>, ...)
          - patterns:
              - pattern-either:
                  - pattern: $W.Write(<... $E.Error() ...>)
                  - pattern: $W.Write(<... $E ...>)
                  - pattern: fmt.Fprint($W, ..., <... $E.Error() ...>, ...)
                  - pattern: fmt.Fprint($W, ..., <... $E ...>, ...)
                  - pattern: fmt.Fprintf($W, ..., <... $E.Error() ...>, ...)
                  - pattern: fmt.Fprintf($W, ..., <... $E ...>, ...)
                  - pattern: fmt.Fprintln($W, ..., <... $E.Error() ...>, ...)
                  - pattern: fmt.Fprintln($W, ..., <... $E ...>, ...)
              # The response writer, by the names the handlers use for it.
              - metavariable-regex:
                  metavariable: $W
                  regex: ^(w|rw|resp|writer)$
