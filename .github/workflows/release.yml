# Design doc item 9. Builds the app image (root Dockerfile) and the backup image
# (deploy/backup/Dockerfile), both tagged with the version, scans them and the pinned postgres and
# cloudflared images (make image-scan MODE=release: a high or critical finding with a fix in any
# of the four stops the release, docs/designs/devsecops.md section 4), then pushes the two images
# it scanned.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The Makefile runs go list when it loads.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built into the local Docker (load: true) under the names make image-scan reads and the ghcr
      # names, so the push below sends exactly the images that were scanned.
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            open-customer:${{ env.VERSION }}
            ghcr.io/jnaranj09/open-customer:${{ env.VERSION }}
      - name: Backup image
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          platforms: linux/amd64
          load: true
          tags: |
            open-customer-backup:${{ env.VERSION }}
            ghcr.io/jnaranj09/open-customer-backup:${{ env.VERSION }}
      - name: Image scan
        run: make image-scan MODE=release VERSION="$VERSION"
      - name: Push
        run: |
          docker push "ghcr.io/jnaranj09/open-customer:$VERSION"
          docker push "ghcr.io/jnaranj09/open-customer-backup:$VERSION"
