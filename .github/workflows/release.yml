# Design doc item 9. Builds and pushes the app image (root Dockerfile) and the backup image
# (deploy/backup/Dockerfile), both tagged with the version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ghcr.io/jnaranj09/open-customer:${{ env.VERSION }}
      - name: Backup image
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jnaranj09/open-customer-backup:${{ env.VERSION }}
