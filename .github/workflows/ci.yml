# Design doc item 8. Runs the CLAUDE.md gate (check-generated and test-db were added in P1, cover
# in P2, e2e in P6, test-deploy in P7, secrets and test-sec with the security pipeline). The job
# security scans the images and the running app (docs/designs/devsecops.md sections 4 and 6). The
# job names gate and security are required checks on main: never rename them.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres: # the e2e database server; the tag is the PG_IMAGE pin
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: open_customer
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: open_customer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_customer -d open_customer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3 # the GITLEAKS_IMAGE pin (make secrets); check-pins compares them
      - name: Dependency audit (web)
        working-directory: web
        run: pnpm audit --audit-level high
      - run: make check-pins
      - run: make lint GOLANGCI_LINT=golangci-lint
      - run: make test
      - run: make vuln
      - run: make check-generated
      - run: make test-db
      - run: make test-deploy
      - run: make cover
      - run: make secrets
      - run: make test-sec
      # After every check above, so they ran with only the web stub (Verification Plan, "Clean checkout");
      # e2e below needs the real build.
      - run: make build
      - name: Install Playwright WebKit
        working-directory: web
        run: pnpm exec playwright install --with-deps webkit
      - run: make e2e
        env:
          E2E_DATABASE_URL: postgres://open_customer:e2e@localhost:5432/open_customer_e2e
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: web/test-results/
          if-no-files-found: ignore

  # Trivy on the app and backup images built here and on the pinned postgres and cloudflared images
  # (make image-scan MODE=push: only the app and backup images block). The SARIF files go to the
  # repo's Security tab, also when the scan is red. Then ZAP and Nuclei on the app image (make dast);
  # its reports are an artifact when it is red.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The Makefile runs go list when it loads.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Trivy downloads its database on every run; the cache is keyed by day, so a run reuses the
      # day's copy and Trivy still refreshes a stale one itself.
      - name: Trivy cache key
        id: trivy-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-
      - run: make image
      - run: make image-scan MODE=push SARIF_DIR=trivy-sarif
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy
      - name: Upload SARIF (app image)
        if: ${{ !cancelled() && hashFiles('trivy-sarif/app.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-sarif/app.sarif
          category: trivy-app
      - name: Upload SARIF (backup image)
        if: ${{ !cancelled() && hashFiles('trivy-sarif/backup.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-sarif/backup.sarif
          category: trivy-backup
      - name: Upload SARIF (postgres image)
        if: ${{ !cancelled() && hashFiles('trivy-sarif/postgres.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-sarif/postgres.sarif
          category: trivy-postgres
      - name: Upload SARIF (cloudflared image)
        if: ${{ !cancelled() && hashFiles('trivy-sarif/cloudflared.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-sarif/cloudflared.sarif
          category: trivy-cloudflared
      # The Nuclei templates release is pinned (NUCLEI_TEMPLATES), so the cache key is the Makefile
      # line that pins it.
      - name: Nuclei templates cache key
        id: nuclei-templates
        if: ${{ !cancelled() }}
        run: echo "version=$(sed -n 's/^NUCLEI_TEMPLATES := //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ runner.temp }}/nuclei
          key: nuclei-templates-${{ steps.nuclei-templates.outputs.version }}
      - run: make dast
        if: ${{ !cancelled() }}
        env:
          NUCLEI_CACHE_DIR: ${{ runner.temp }}/nuclei
      - name: Upload dast reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dast-report
          path: dast-report/
          if-no-files-found: ignore
