# Design doc item 8. Runs the CLAUDE.md gate; each phase adds its steps (check-generated and
# test-db from P1, cover from P2, e2e from P6).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (web)
        working-directory: web
        run: pnpm audit --audit-level high
      - run: make check-pins
      - run: make lint GOLANGCI_LINT=golangci-lint
      - run: make test
      - run: make vuln
      - run: make check-generated
      - run: make test-db
      # Last, so every check above ran with only the web stub (Verification Plan, "Clean checkout").
      - run: make build
