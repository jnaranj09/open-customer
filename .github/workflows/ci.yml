# Design doc item 8. Runs the CLAUDE.md gate (check-generated and test-db were added in P1, cover
# in P2, e2e in P6).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres: # the e2e database server; the tag is the PG_IMAGE pin
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: open_customer
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: open_customer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_customer -d open_customer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (web)
        working-directory: web
        run: pnpm audit --audit-level high
      - run: make check-pins
      - run: make lint GOLANGCI_LINT=golangci-lint
      - run: make test
      - run: make vuln
      - run: make check-generated
      - run: make test-db
      - run: make cover
      # Last, so every check above ran with only the web stub (Verification Plan, "Clean checkout").
      - run: make build
      # make e2e calls psql on the runner when E2E_DATABASE_URL is set. The runner image docs do not
      # say whether psql is present, so this shows it in the first run; install postgresql-client
      # here if it is missing.
      - name: Check psql
        run: psql --version
      - name: Install Playwright WebKit
        working-directory: web
        run: pnpm exec playwright install --with-deps webkit
      - run: make e2e
        env:
          E2E_DATABASE_URL: postgres://open_customer:e2e@localhost:5432/open_customer_e2e
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: web/test-results/
          if-no-files-found: ignore
